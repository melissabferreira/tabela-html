<!DOCTYPE html>
<html lang="pt-br">
<body>
    <h1>Formulário HTML</h1>
    <form action="/pagina-processados-do-form" method="post">
    <fieldset>
        <legend>Dados Gerais</legend>
        <label for="nome">Nome:</label>
        <input type="text" minlength="10" id="nome"/>
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="text" id="data_nascimento"/>
        <label for="cpf">CPF:</label>
        <input type="cpf" minlength="11" id="cpf"/>
    </fieldset>
    <fieldset>
        <legend>Endereço</legend>
        <label for="tipo_endereco">Tipo:</label>
        <select name="tipo_endereco">
            <option value="">Selecione</option>
            <option value="">Rua</option>
            <option value="">Estrada</option>
            <option value="">Rodovia</option>
            <option value="">Outros</option>
        </select>
        <label for="logradouro_endereco">Logradouro:</label>
        <input type="text" id="logradouro_endereco"/>
        <label for="numero_endereco">Numero:</label>
        <input type="text" id="numero_endereco"/>
        <label for="complemento_endereco">Compemento:</label>
        <input type="text" id="complemento_endereco"/>
    </fieldset>
    </form>
</body>
</html>
